[workspace]
resolver = "3"
members = ["apps/resonance", "apps/resonance-import", "crates/content", "crates/game", "crates/import", "crates/presentation", "tools/oracle", "crates/symphonia-script", "crates/symphonia-script-vm", "crates/symphonia-script-compiler", "crates/symphonia-script-tools", "crates/resonance-events", "crates/media", "crates/audio-cook", "crates/audio", "crates/playback", "crates/audio-device", "crates/persistence", "crates/asset-writer", "crates/script-content"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
resonance-script-content = { path = "crates/script-content" }
resonance-asset-writer = { path = "crates/asset-writer" }
resonance-persistence = { path = "crates/persistence" }
resonance-playback = { path = "crates/playback" }
resonance-audio-device = { path = "crates/audio-device" }
anyhow = "1"
resonance-media = { path = "crates/media" }
resonance-audio-cook = { path = "crates/audio-cook" }
resonance-audio = { path = "crates/audio" }
thiserror = "2"
symphonia-script = { path = "crates/symphonia-script" }
symphonia-script-vm = { path = "crates/symphonia-script-vm" }
symphonia-script-compiler = { path = "crates/symphonia-script-compiler" }
symphonia-script-tools = { path = "crates/symphonia-script-tools" }
resonance-events = { path = "crates/resonance-events" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3.55", default-features = false, features = ["std"] }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
bevy = { version = "=0.19.1", default-features = false, features = ["std", "reflect_auto_register", "async_executor", "multi_threaded", "bevy_asset", "bevy_winit", "bevy_window", "bevy_render", "bevy_core_pipeline", "bevy_sprite", "bevy_sprite_render", "bevy_camera", "bevy_color", "bevy_image", "bevy_log", "bevy_gilrs", "bevy_pbr", "bevy_gltf", "bevy_scene", "gltf_animation", "png", "ktx2", "zstd_rust", "x11", "wayland"] }
resonance-content = { path = "crates/content" }
resonance-game = { path = "crates/game" }
resonance-import = { path = "crates/import" }
resonance-presentation = { path = "crates/presentation" }

[profile.dev]
debug = 0
# Keep development builds usable for real-time rendering and audio across the
# whole workspace. Debug assertions and overflow checks remain enabled.
opt-level = 2
debug-assertions = true
overflow-checks = true

[profile.release]
opt-level = 3
lto = "thin"
strip = "debuginfo"
