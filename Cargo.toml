[workspace]
resolver = "3"
members = ["crates/battle", "apps/resonance", "apps/resonance-import", "apps/resonance-script", "crates/content", "crates/game", "crates/importer", "crates/presentation", "tools/oracle", "crates/symphonia-script", "crates/symphonia-script-vm", "crates/symphonia-script-compiler", "crates/symphonia-script-tools", "crates/resonance-events", "crates/media", "crates/audio-cook", "crates/audio", "crates/playback", "crates/audio-device", "crates/persistence", "crates/asset-writer", "crates/model-behavior", "crates/script-content", "crates/symphonia-constants"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
symphonia-constants = { path = "crates/symphonia-constants" }
resonance-battle = { path = "crates/battle" }
resonance-model-behavior = { path = "crates/model-behavior" }
resonance-script-content = { path = "crates/script-content" }
resonance-asset-writer = { path = "crates/asset-writer" }
resonance-persistence = { path = "crates/persistence" }
resonance-playback = { path = "crates/playback" }
resonance-audio-device = { path = "crates/audio-device" }
anyhow = "1"
resonance-media = { path = "crates/media" }
resonance-audio-cook = { path = "crates/audio-cook" }
resonance-audio = { path = "crates/audio" }
thiserror = "2"
symphonia-script = { path = "crates/symphonia-script" }
symphonia-script-vm = { path = "crates/symphonia-script-vm" }
symphonia-script-compiler = { path = "crates/symphonia-script-compiler" }
symphonia-script-tools = { path = "crates/symphonia-script-tools" }
resonance-events = { path = "crates/resonance-events" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
time = { version = "0.3.55", default-features = false, features = ["std"] }
sha2 = "0.11.1"
glam = { version = "0.34.1", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png"] }
bevy = { version = "=0.20.1", default-features = false, features = ["std", "reflect_auto_register", "async_executor", "multi_threaded", "bevy_asset", "bevy_winit", "bevy_window", "bevy_render", "bevy_core_pipeline", "bevy_sprite", "bevy_sprite_render", "bevy_camera", "bevy_color", "bevy_image", "bevy_log", "bevy_gilrs", "bevy_pbr", "bevy_gltf", "bevy_scene", "ktx2", "zstd_rust", "x11", "wayland"] }
bevy_post_process = { version = "=0.20.1", default-features = false }
raw-window-handle = "0.6"
resonance-content = { path = "crates/content" }
resonance-game = { path = "crates/game" }
resonance-importer = { path = "crates/importer" }
resonance-presentation = { path = "crates/presentation" }

[profile.dev]
debug = 0
# Keep development builds usable for real-time rendering and audio across the
# whole workspace. Debug assertions and overflow checks remain enabled.
opt-level = 2
debug-assertions = true
overflow-checks = true

# Workspace tests favor fast rebuilds; dependencies keep their runtime performance.
[profile.test]
opt-level = 0

[profile.test.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
strip = "debuginfo"

# Optimized local iteration without whole-program LTO on every executable.
[profile.release-fast]
inherits = "release"
lto = "off"
incremental = true
