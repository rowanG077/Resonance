name: Test and release

on:
  push:
    # Release pushes delegate to an open release PR when one exists.
    branches: [main, 'release/**']
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a release branch after preparing its changelog
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # New commits supersede old builds, including release branches.
  cancel-in-progress: true

jobs:
  prepare:
    name: Plan CI and validate release version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      run_tests: ${{ steps.plan.outputs.run_tests }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      - name: Check out source for CI planning
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Select the push or PR run that owns CI
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/plan_workflow.py

  changelog:
    name: Consolidate release changelog
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    outputs:
      commit: ${{ steps.notes.outputs.commit }}
      changed: ${{ steps.notes.outputs.changed }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: true

      - name: Install pinned changelog tool
        run: |
          python3 -m venv target/qlog
          QLOG_REV=$(python3 -c 'import json; print(json.load(open("flake.lock"))["nodes"]["qlog"]["locked"]["rev"])')
          target/qlog/bin/pip install "git+https://github.com/qbaylogic/qlog.git@$QLOG_REV"
          echo "$PWD/target/qlog/bin" >> "$GITHUB_PATH"

      - name: Consolidate and commit notes
        id: notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: python3 tools/ci/prepare_changelog.py --version "$VERSION" --branch "$RELEASE_BRANCH" --commit "$RELEASE_COMMIT"

      - name: Run CI for the changelog commit
        if: steps.notes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: gh workflow run build.yml --ref "$RELEASE_BRANCH" -f publish_release=true

  test:
    name: ${{ matrix.platform }}
    needs: [prepare, changelog]
    if: >-
      ${{ !cancelled() && needs.prepare.outputs.run_tests == 'true' &&
          (needs.changelog.result == 'success' || needs.changelog.result == 'skipped') &&
          needs.changelog.outputs.changed != 'true' }}
    concurrency:
      group: test-${{ matrix.platform }}-${{ needs.changelog.outputs.commit || needs.prepare.outputs.commit }}
      cancel-in-progress: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
          - platform: macos-arm64
            runner: macos-15
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    env:
      EXE: ${{ startsWith(matrix.runner, 'windows-') && '.exe' || '' }}
      CARGO_BUILD_JOBS: "2"
      # Bundle the importer's compression codecs into the executable instead
      # of linking against a runner's Homebrew or vcpkg installation.
      LIBZ_SYS_STATIC: "1"
      LZMA_API_STATIC: "1"
      BZIP2_NO_PKG_CONFIG: "1"
      VCPKGRS_DISABLE: "1"
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      MACOSX_DEPLOYMENT_TARGET: "14.0"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changelog.outputs.commit || needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config cmake ninja-build \
            libasound2-dev libdbus-1-dev libudev-dev libvulkan-dev mesa-vulkan-drivers \
            libegl1 libgl1-mesa-dri xvfb xauth \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev

      - name: Fetch locked dependencies for offline shader validation
        # The shader test reads workspace metadata offline. Compiling selected
        # packages does not download every dependency that metadata resolves.
        # Fetch all targets so this also works on a fresh runner's Cargo cache.
        run: cargo fetch --locked

      - name: Run smoke tests without private resources
        env:
          RESONANCE_SMOKE_OUTPUT: ${{ github.workspace }}/target/smoke
        run: |
          cargo test --locked --profile release-fast -p resonance-importer --lib
          cargo test --locked --profile release-fast -p resonance-audio-cook --lib interpolation::tests::
          cargo test --locked --profile release-fast -p resonance-import-cli
          cargo test --locked --profile release-fast -p resonance-playback --lib
          cargo test --locked --profile release-fast -p resonance-media --lib --test rust_codecs --test audio_smoke
          cargo test --locked --profile release-fast -p resonance-persistence --test slots
          cargo test --locked --profile release-fast -p resonance-game -p resonance-events
          cargo test --locked --profile release-fast -p resonance-presentation --lib
          cargo test --locked --profile release-fast -p resonance --bin resonance

      - name: Install crash analysis tools
        run: |
          cargo install --locked --version 2.3.9 dump_syms
          cargo install --locked --version 0.27.0 minidump-stackwalk

      - name: Resolve an application crash to its source
        if: needs.prepare.outputs.publish != 'true'
        run: python tools/ci/crash_symbols.py --verify target/smoke/crash-symbols

      - name: Check effect comparison gates and generators
        if: matrix.platform == 'linux-x64'
        run: |
          python3 -m venv target/oracle-tests
          target/oracle-tests/bin/pip install numpy Pillow
          target/oracle-tests/bin/python -m unittest discover -s tools/oracle -p 'test_effect*.py'

      - name: Check release tooling
        if: matrix.platform == 'linux-x64'
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py'

      - name: Install pinned Windows software renderer and shader compiler
        if: runner.os == 'Windows'
        # wgpu's Windows CI uses a current WARP/DXC stack instead of the older
        # WARP driver and FXC compiler bundled with Windows Server 2022.
        run: python tools/ci/install_windows_renderer.py

      - name: Render and check pixels (Metal on macOS, CPU elsewhere)
        run: cargo run --locked --profile release-fast -p resonance-presentation --example ci_render -- target/smoke

      - name: Check capture waits for a delayed overlay shader
        if: matrix.platform == 'linux-x64'
        run: cargo run --locked --profile release-fast -p resonance-presentation --example ci_render -- target/smoke/delayed-overlay 80

      - name: Render and check OpenGL pixels
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: cargo run --locked --profile release-fast -p resonance-presentation --example ci_render -- target/smoke/opengl --opengl

      - name: Check OpenGL window presentation
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a cargo run --locked --profile release-fast -p resonance-presentation --example ci_render -- target/smoke/opengl-window --opengl --windowed

      - name: Check OpenGL fallback, SMAA and captured-scene depth
        if: matrix.platform == 'linux-x64'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          WGPU_BACKEND: vulkan,gl
          VK_DRIVER_FILES: /dev/null
        run: |
          cargo test --locked --profile release-fast -p resonance-presentation --lib -- \
            --ignored --test-threads=1 \
            anti_aliasing::smaa::tests::regular_smaa_preserves_scene_colors \
            field_refraction::tests::captured_meshes_obey_per_sample_depth_in_every_aa_mode

      - name: Check camera clears and overlays with MSAA
        if: matrix.platform == 'linux-x64'
        run: |
          cargo test --locked --profile release-fast -p resonance-presentation --lib \
            anti_aliasing::compositing_tests::shared_targets_respect_clear_and_load_with_msaa \
            -- --ignored --exact

      - name: Build release executables
        if: needs.prepare.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cargo build --locked --release -p resonance -p resonance-import-cli
          "target/release/resonance$EXE" --help
          "target/release/resonance-import$EXE" --help
          test "$("target/release/resonance$EXE" --version)" = "resonance ${VERSION#v}"
          test "$("target/release/resonance-import$EXE" --version)" = "resonance-import ${VERSION#v}"

      - name: Generate release debugging symbols
        if: needs.prepare.outputs.publish == 'true'
        run: |
          for BINARY in resonance resonance-import; do
            python tools/ci/crash_symbols.py --binary "target/release/$BINARY$EXE" --output "target/release/$BINARY.sym"
          done

      - name: Package executables and debugging symbols
        if: needs.prepare.outputs.publish == 'true'
        env:
          RELEASE_COMMIT: ${{ needs.changelog.outputs.commit || needs.prepare.outputs.commit }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          python tools/ci/package_release.py --version "$VERSION" --platform "$PLATFORM" --symbols

      - name: Verify packaged crash artifacts
        if: needs.prepare.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          SUFFIX=tar.gz
          if [[ "$PLATFORM" == windows-* ]]; then SUFFIX=zip; fi
          python tools/ci/crash_symbols.py --verify target/smoke/release-crash \
            --game-archive "target/dist/resonance-$VERSION-$PLATFORM.$SUFFIX" \
            --symbols-archive "target/dist/resonance-$VERSION-$PLATFORM-symbols.$SUFFIX"

      - name: Upload synthetic render and audio diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ matrix.platform }}
          path: target/smoke/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload executable archives
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: target/dist/resonance-*
          archive: false
          if-no-files-found: error
          retention-days: 14

  analyze-crashes:
    name: Analyze every platform's crashes on Linux
    needs: [prepare, changelog, test]
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changelog.outputs.commit || needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Download crash fixtures and portable symbols
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: smoke-*
          path: target/crash-fixtures

      - name: Install portable stackwalker
        run: cargo install --locked --version 0.27.0 minidump-stackwalk

      - name: Resolve foreign dumps and text backtraces without native debug tools
        env:
          FIXTURE: ${{ needs.prepare.outputs.publish == 'true' && 'release-crash' || 'crash-symbols' }}
        run: |
          for PLATFORM in windows-x64 macos-arm64 linux-x64 linux-arm64; do
            python tools/ci/crash_symbols.py --verify-analysis "target/crash-fixtures/smoke-$PLATFORM/$FIXTURE"
          done

  release:
    name: Publish GitHub release
    needs: [prepare, changelog, test, analyze-crashes]
    if: >-
      needs.prepare.outputs.publish == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changelog.outputs.commit || needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Download tested executable archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: resonance-*
          path: target/dist
          merge-multiple: true
          # Preserve the Windows ZIP as a release asset instead of extracting it.
          skip-decompress: true

      - name: Tag commit and publish all platforms
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ needs.changelog.outputs.commit || needs.prepare.outputs.commit }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash tools/ci/publish_release.sh
