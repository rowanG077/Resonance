name: Test and release

on:
  push:
    # These branches use push runs; other branches use their PR updates.
    branches: [main, 'release/**']
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Finish a release before processing another push to the same branch.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/release/') }}

jobs:
  prepare:
    name: Validate release version
    # Same-repository main/release branches already have a push run. Fork PRs
    # still need our checks, including forks whose branch is named release/*.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      (github.head_ref != 'main' && !startsWith(github.head_ref, 'release/'))
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Read version from branch
        id: version
        shell: bash
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$REF" == refs/heads/release/* ]]; then
            if [[ ! "$REF" =~ ^refs/heads/release/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo '::error::Release branches must be named release/vX.X.X (for example, release/v0.1.0).'
              exit 1
            fi
            echo "version=${REF#refs/heads/release/}" >> "$GITHUB_OUTPUT"
            echo "publish=$([[ "$EVENT" == push ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          else
            echo 'version=' >> "$GITHUB_OUTPUT"
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Check out release manifest
        if: steps.version.outputs.version != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check workspace version matches release branch
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          manifest = tomllib.loads(Path("Cargo.toml").read_text())
          version = manifest["workspace"]["package"]["version"]
          if f"v{version}" != os.environ["VERSION"]:
              raise SystemExit(f"Release branch version {os.environ['VERSION']} does not match Cargo.toml version {version}")
          PY

  test:
    name: ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
          - platform: macos-arm64
            runner: macos-15
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    env:
      EXE: ${{ startsWith(matrix.runner, 'windows-') && '.exe' || '' }}
      CARGO_BUILD_JOBS: "2"
      # Bundle the importer's compression codecs into the executable instead
      # of linking against a runner's Homebrew or vcpkg installation.
      LIBZ_SYS_STATIC: "1"
      LZMA_API_STATIC: "1"
      BZIP2_NO_PKG_CONFIG: "1"
      VCPKGRS_DISABLE: "1"
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      MACOSX_DEPLOYMENT_TARGET: "14.0"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config cmake ninja-build \
            libasound2-dev libdbus-1-dev libudev-dev libvulkan-dev mesa-vulkan-drivers \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev

      - name: Fetch locked dependencies for offline shader validation
        # The shader test reads workspace metadata offline. Compiling selected
        # packages does not download every dependency that metadata resolves.
        # Fetch all targets so this also works on a fresh runner's Cargo cache.
        run: cargo fetch --locked

      - name: Run smoke tests without private resources
        env:
          RESONANCE_SMOKE_OUTPUT: ${{ github.workspace }}/target/smoke
        run: |
          cargo test --locked --profile release-fast -p resonance-importer --lib
          cargo test --locked --profile release-fast -p resonance-audio-cook --lib interpolation::tests::
          cargo test --locked --profile release-fast -p resonance-import-cli
          cargo test --locked --profile release-fast -p resonance-playback --lib
          cargo test --locked --profile release-fast -p resonance-media --lib --test rust_codecs --test audio_smoke
          cargo test --locked --profile release-fast -p resonance-persistence --test slots
          cargo test --locked --profile release-fast -p resonance-game -p resonance-events
          cargo test --locked --profile release-fast -p resonance-presentation --lib
          cargo test --locked --profile release-fast -p resonance --bin resonance

      - name: Check effect comparison gates and generators
        if: matrix.platform == 'linux-x64'
        run: |
          python3 -m venv target/oracle-tests
          target/oracle-tests/bin/pip install numpy Pillow
          target/oracle-tests/bin/python -m unittest discover -s tools/oracle -p 'test_effect*.py'

      - name: Check release tooling
        if: matrix.platform == 'linux-x64'
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py'

      - name: Render and check pixels (Metal on macOS, CPU elsewhere)
        run: cargo run --locked --profile release-fast -p resonance-presentation --example ci_render -- target/smoke

      - name: Check camera clears and overlays with MSAA
        if: matrix.platform == 'linux-x64'
        run: |
          cargo test --locked --profile release-fast -p resonance-presentation --lib \
            anti_aliasing::compositing_tests::shared_targets_respect_clear_and_load_with_msaa \
            -- --ignored --exact

      - name: Upload synthetic render and audio diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ matrix.platform }}
          path: target/smoke/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build release executables
        if: needs.prepare.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cargo build --locked --release -p resonance -p resonance-import-cli
          "target/release/resonance$EXE" --help
          "target/release/resonance-import$EXE" --help
          test "$("target/release/resonance$EXE" --version)" = "resonance ${VERSION#v}"
          test "$("target/release/resonance-import$EXE" --version)" = "resonance-import ${VERSION#v}"

      - name: Package executables
        if: needs.prepare.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          python tools/ci/package_release.py --version "$VERSION" --platform "$PLATFORM"

      - name: Upload executable archives
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: target/dist/resonance-*
          archive: false
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: [prepare, test]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download tested executable archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: resonance-*
          path: target/dist
          merge-multiple: true
          # Preserve the Windows ZIP as a release asset instead of extracting it.
          skip-decompress: true

      - name: Tag commit and publish all platforms
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash tools/ci/publish_release.sh
