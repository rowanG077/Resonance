[package]
name = "resonance-content"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
symphonia-constants = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
glam.workspace = true
gltf = { version = "=1.4.1", default-features = false, features = ["utils", "names", "extras"] }
hound = "3.5"
resonance-asset-writer.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[features]
test-support = []

[dev-dependencies]
tempfile = "3"
