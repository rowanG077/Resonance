[package]
name = "resonance-asset-writer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true
ktx2 = "=0.5.0"
structured-zstd = { version = "=0.2.6", default-features = false, features = ["kernel-scalar"] }
hound = "3.5"
image.workspace = true
ruzstd = "=0.9.1"
bcdec_rs = "=0.2.1"
texture-compressor = { git = "https://github.com/rowanG077/texture-compressor", rev = "c4ae055c45a9460ce2433669cd1ac0e76fb4487d", optional = true }
sha2.workspace = true

[features]
# Pure-Rust BC7 cooking; the game only decodes.
encode = ["dep:texture-compressor"]

[dev-dependencies]
# Tests cover the encoder too.
resonance-asset-writer = { path = ".", features = ["encode"] }
